# 仅 HTTP（尚未安装 SSL 证书时使用；装好证书后执行 scripts/install-ssl.sh 切换为 HTTPS 配置）
# bootstrap-server.sh 在未检测到证书时会自动使用本文件。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/nooktalk/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/nooktalk.access.log;
    error_log  /var/log/nginx/nooktalk.error.log;
}
