# 安装：sudo cp /var/www/nooktalk/deploy/nginx-nooktalk.conf /etc/nginx/sites-available/nooktalk
# 启用：sudo ln -sf /etc/nginx/sites-available/nooktalk /etc/nginx/sites-enabled/
# 默认站点冲突时可：sudo rm /etc/nginx/sites-enabled/default
# 检查并重载：sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 45.249.246.139 _;

    root /var/www/nooktalk/dist;
    index index.html;

    # 单页应用：子路径回退到 index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 API（与 Vite 开发时 /api 行为一致）
    location /api/ {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/nooktalk.access.log;
    error_log  /var/log/nginx/nooktalk.error.log;
}
