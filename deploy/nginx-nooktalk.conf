# HTTPS 站点（证书路径由 scripts/install-ssl.sh 安装到 /etc/nginx/ssl/nooktalk/）
# 安装：sudo bash /var/www/nooktalk/scripts/install-ssl.sh
# 检查并重载：sudo nginx -t && sudo systemctl reload nginx

# HTTP 跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.nooktalk.top nooktalk.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nooktalk.top nooktalk.top;

    ssl_certificate     /etc/nginx/ssl/nooktalk/www.nooktalk.top.pem;
    ssl_certificate_key /etc/nginx/ssl/nooktalk/www.nooktalk.top.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:NooktalkSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/nooktalk/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/nooktalk.access.log;
    error_log  /var/log/nginx/nooktalk.error.log;
}
